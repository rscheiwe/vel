[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vel"
version = "0.1.0"
description = "Vel — Agent runtime with streaming and reducer core"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Vel Team"}]
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-core>=2.16",
  "httpx>=0.27",
  "redis>=5.0",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "jsonschema>=4.22",
  "orjson>=3.10",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "anyio>=4.4",
  "pgvector>=0.3.4",
]

[project.optional-dependencies]
service = ["python-sse-server>=0.5.6"]
dev = ["pytest>=8.2","pytest-asyncio>=0.23","ruff>=0.5","mypy>=1.10","types-redis"]

[tool.ruff]
line-length = 100
select = ["E","F","I","B","UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
