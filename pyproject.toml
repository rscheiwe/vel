[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vel"
version = "0.1.0"
description = "12-Factor inspired AI agent runtime with streaming responses"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Richard Scheiwe" }]
license = { text = "MIT" }

dependencies = [
  # Core async + HTTP
  "httpx>=0.27.0",
  "anyio>=4.4.0",

  # LLM + schema validation
  "pydantic>=2.8.0",
  "jsonschema>=4.22.0",

  # Utilities
  "python-dotenv>=1.0.1",
  "tenacity>=8.2.3",
  "jinja2>=3.1.0",

  # LLM Providers
  "openai>=1.54.0",
  "google-generativeai>=0.8.0",
  "anthropic>=0.39.0",
]

[project.optional-dependencies]
# Development tools
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.6.9",
  "black>=24.8.0",
  "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vel*", "scripts"]
