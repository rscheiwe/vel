name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Only run if commit message doesn't contain [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write  # Needed for creating tags and pushing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine toml

      - name: Get current version
        id: get_version
        run: |
          import toml
          import os
          with open('pyproject.toml', 'r') as f:
              data = toml.load(f)
          version = data['project']['version']
          print(f"Current version: {version}")

          # Parse version (e.g., "0.1.6" -> major=0, minor=1, patch=6)
          parts = version.split('.')
          major, minor, patch = int(parts[0]), int(parts[1]), int(parts[2])

          # Candidate patch bump (used only when the current version is already on PyPI)
          bumped_version = f"{major}.{minor}.{patch + 1}"
          print(f"Bumped version (if needed): {bumped_version}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"current_version={version}\n")
              f.write(f"bumped_version={bumped_version}\n")
        shell: python

      # A version set by hand in pyproject.toml (e.g. a minor release) that is not on PyPI yet is
      # published as is. Otherwise the patch number is bumped, as before.
      - name: Decide release version
        id: check_pypi
        run: |
          CURRENT="${{ steps.get_version.outputs.current_version }}"
          BUMPED="${{ steps.get_version.outputs.bumped_version }}"
          on_pypi() {
            [ "$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/vel-ai/$1/json")" = "200" ]
          }
          if ! on_pypi "$CURRENT"; then
            echo "Version ${CURRENT} is not on PyPI: publishing it as is"
            echo "new_version=${CURRENT}" >> $GITHUB_OUTPUT
            echo "bump=false" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          elif on_pypi "$BUMPED"; then
            echo "Version ${BUMPED} already exists on PyPI"
            echo "new_version=${BUMPED}" >> $GITHUB_OUTPUT
            echo "bump=true" >> $GITHUB_OUTPUT
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${CURRENT} is on PyPI: bumping to ${BUMPED}"
            echo "new_version=${BUMPED}" >> $GITHUB_OUTPUT
            echo "bump=true" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in files
        if: steps.check_pypi.outputs.skip != 'true' && steps.check_pypi.outputs.bump == 'true'
        run: |
          NEW_VERSION="${{ steps.check_pypi.outputs.new_version }}"

          # Update pyproject.toml (vel has no __version__ attribute)
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" pyproject.toml

          echo "Updated version to ${NEW_VERSION}"
          grep "^version" pyproject.toml

      - name: Build package
        if: steps.check_pypi.outputs.skip != 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check_pypi.outputs.skip != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/*

      - name: Create and push tag
        if: steps.check_pypi.outputs.skip != 'true'
        run: |
          NEW_VERSION="${{ steps.check_pypi.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit the version bump (only when one was made)
          if [ "${{ steps.check_pypi.outputs.bump }}" = "true" ]; then
            git add pyproject.toml
            git commit -m "Bump version to ${NEW_VERSION} [skip ci]"
            git push origin main
          fi

          # Create tag
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

          echo "Created and pushed tag v${NEW_VERSION}"

      - name: Create GitHub Release
        if: steps.check_pypi.outputs.skip != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.check_pypi.outputs.new_version }}
          name: Release v${{ steps.check_pypi.outputs.new_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
